<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santa Ana House 21</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============ PANTALLA DE LOGIN ============ -->
  <div id="pantalla-login" class="pantalla">
    <div class="login-card">
      <img src="logo.png" alt="Santa Ana House 21" class="logo-login" onerror="this.style.display='none'" />
      <h1 class="login-titulo">Santa Ana House 21</h1>
      <p>Ingresa con tu correo y contraseña asignados por el hotel.</p>
      <form id="form-login" class="form-login">
        <label>
          Correo
          <input type="email" id="login-email" required autocomplete="username" />
        </label>
        <label>
          Contraseña
          <input type="password" id="login-password" required autocomplete="current-password" />
        </label>
        <p id="error-login" class="error-login oculto"></p>
        <button type="submit" id="btn-login" class="btn btn-primario">Ingresar</button>
      </form>
      <!-- Marca de agua de Lit Performance (desarrollador del sistema) —
           visible en la pantalla de login, antes de entrar. -->
      <p class="marca-lit-performance">Sistema desarrollado por Lit Performance · 3245067380</p>
    </div>
  </div>

  <!-- ============ PANTALLA PRINCIPAL DE LA APP ============ -->
  <div id="pantalla-app" class="pantalla oculto">

    <header class="app-header">
      <div class="app-header-top">
        <!-- Logo del hotel + dirección, a la izquierda (como estaba antes
             de la marca de Lit Performance — ese crédito se dejó solo en
             el login y en el pie de página, ver footer más abajo). -->
        <div class="header-logo-marca">
          <img src="logo.png" alt="Santa Ana House 21" class="logo-header" onerror="this.style.display='none'" />
          <span class="subtitulo-header">Carrera 21 6A-07 Bogotá</span>
        </div>
        <div class="usuario-info">
          <span id="nombre-usuario-activo"></span>
          <button id="btn-cerrar-sesion" class="btn-cerrar-sesion">Cerrar sesión</button>
        </div>
      </div>

      <!-- Pestañas de primer nivel (secciones) + una segunda fila que
           muestra solo las subpestañas de la sección activa. -->
      <nav id="tabs-nav" class="tabs-nav"></nav>
      <nav id="tabs-nav-sub" class="tabs-nav tabs-nav-sub oculto"></nav>
    </header>

    <main id="main-content" class="main-content"></main>

    <!-- Pie de página fijo con la marca de Lit Performance — al estar
         fuera del router, aparece en TODOS los módulos/pantallazos del
         sistema sin tener que tocar cada uno por separado. -->
    <footer class="app-footer">
      <span>Lit Performance · 3245067380</span>
    </footer>

  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Único punto de entrada de JS. Todos los módulos son archivos sueltos
       en la raíz del repo (ver ARCHITECTURE.md: sin subcarpetas, a propósito,
       para que la subida manual por la interfaz web de GitHub nunca rompa rutas). -->
  <script type="module" src="app.js"></script>

</body>
</html>
